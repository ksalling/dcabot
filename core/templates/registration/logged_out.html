{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-lg shadow-lg text-center">
    <h2 class="text-3xl font-bold text-white mb-6">Logged Out</h2>

    <p class="text-gray-400 mb-8 text-lg">
        You have been successfully logged out. Thanks for using Moondrip!
    </p>

    <div class="space-y-4">
        <a href="{% url 'login' %}"
            class="inline-block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded transition-colors duration-200">
            Log In Again
        </a>

        <a href="{% url 'register' %}"
            class="inline-block w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded transition-colors duration-200">
            Create New Account
        </a>
    </div>
</div>
{% endblock %}
