{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-800 p-8 rounded-lg shadow-lg text-center">
    <h2 class="text-2xl font-bold text-white mb-4">Password Changed!</h2>

    <p class="text-gray-400 mb-6">
        Your password has been set. You may go ahead and log in now.
    </p>

    <div class="mt-8">
        <a href="{% url 'login' %}"
            class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded transition-colors">
            Log In
        </a>
    </div>
</div>
{% endblock %}
