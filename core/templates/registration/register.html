{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-800 p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Create an Account</h2>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-4">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>
            <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}"
                class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500"
                {% if field.value %}value="{{ field.value }}" {% endif %} {% if field.field.required %}required
                {%endif%}>
            {% if field.help_text %}
            <p class="text-gray-500 text-xs mt-1">{{ field.help_text|safe }}</p>
            {% endif %}
            {% for error in field.errors %}
            <p class="text-red-400 text-xs mt-1">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit"
            class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded transition-colors mt-4">
            Register
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-400 text-sm">
            Already have an account? <a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300">
                Login here</a>
        </p>
    </div>
</div>
{% endblock %}
