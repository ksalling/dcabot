{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-800 p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Login</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <div class="bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded mb-4" role="alert">
            <p class="font-bold">Error</p>
            <p>Invalid username or password.</p>
        </div>
        {% endif %}

        <div class="mb-4">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="id_username">
                Email Address
            </label>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150"
                required id="id_username"
                class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div class="mb-6">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="id_password">
                Password
            </label>
            <input type="password" name="password" autocomplete="current-password" required id="id_password"
                class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition-colors">
            Sign In
        </button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>

    {% if app_settings and app_settings.allow_google_oauth %}
    <div class="mt-6 flex flex-col items-center">
        <div class="flex items-center w-full mb-4">
            <hr class="flex-grow border-gray-600">
            <span class="px-3 text-gray-500 text-sm">Or</span>
            <hr class="flex-grow border-gray-600">
        </div>
        <a href="{% url 'google_login' %}"
            class="w-full flex justify-center items-center bg-white hover:bg-gray-100 text-gray-900 font-semibold py-2 px-4 shadow-sm transition-colors rounded">
            <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                </path>
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                </path>
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                </path>
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                </path>
            </svg>
            Continue with Google
        </a>
    </div>
    {% endif %}

    <div class="mt-6 flex justify-between items-center text-sm">
        <a href="{% url 'register' %}" class="text-gray-400 hover:text-white transition-colors">Create Account</a>
        <a href="{% url 'password_reset' %}" class="text-blue-400 hover:text-blue-300 transition-colors">Forgot
            Password?</a>
    </div>
</div>
{% endblock %}
