{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded-lg shadow-lg mt-10">
    <h2 class="text-2xl font-bold mb-6 text-white">Change Password</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <div class="block text-sm font-medium text-gray-400 mb-1">
                {{ field.label_tag }}
            </div>
            <div class="text-gray-900">
                {{ field }}
            </div>
            {% if field.help_text %}
            <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
            {% endif %}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">
            Change Password
        </button>
    </form>
</div>
<style>
    input[type="password"] {
        width: 100%;
        padding: 0.5rem;
        border-radius: 0.375rem;
        background-color: #374151;
        border: 1px solid #4B5563;
        color: white;
    }
</style>
{% endblock %}
