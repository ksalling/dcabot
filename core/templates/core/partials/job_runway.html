<div class="flex justify-between items-center text-xs mt-3 pt-3 border-t border-gray-700 animate-fade-in">
    <div class="text-gray-400">
        Runway:
    </div>
    <div class="text-right">
        <span class="block text-white font-medium">
            {{ balance|floatformat:2 }} {{ currency }}
        </span>
        <span class="block {% if runs_remaining < 5 %}text-red-400 font-bold{% else %}text-gray-400{% endif %}">
            ≈ {{ runs_remaining }} runs
        </span>
    </div>
</div>
