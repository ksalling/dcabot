<div class="text-right animate-fade-in mt-1">
    <div class="text-[10px] uppercase tracking-wide text-gray-500 mb-0.5">Runway</div>
    <div class="text-sm font-medium text-white leading-tight">
        {{ balance|floatformat:2 }} <span class="text-xs text-gray-400">{{ currency }}</span>
    </div>
    <div class="text-xs {% if runs_remaining < 5 %}text-red-400 font-bold{% else %}text-gray-500{% endif %}">
        ≈ {{ runs_remaining }} runs
    </div>
</div>
