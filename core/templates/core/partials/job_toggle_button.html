<button hx-post="{% url 'job_toggle' pk=job.pk %}" hx-swap="outerHTML"
    class="px-3 py-1 rounded text-xs font-bold {% if job.is_active %}bg-green-600 text-green-100 hover:bg-green-500{% else %}bg-gray-600 text-gray-300 hover:bg-gray-500{% endif %}">
    {% if job.is_active %}Active{% else %}Paused{% endif %}
</button>
