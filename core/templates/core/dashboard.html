{% extends 'base.html' %}

{% block content %}
<div class="space-y-8">

    <!-- Header / Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold text-white">Dashboard</h2>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <!-- Auto-refresh interval selector & live countdown -->
            <div class="inline-flex items-center bg-gray-800 border border-gray-700 rounded-md px-3 py-1 text-xs text-gray-300">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-2" id="refresh-pulse-dot"></span>
                <label for="auto-refresh-select" class="text-gray-400 mr-2 font-medium">Auto-refresh:</label>
                <select id="auto-refresh-select" 
                        class="bg-gray-900 border border-gray-700 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="30000">30s</option>
                    <option value="60000">1m</option>
                    <option value="300000" selected>5m (Default)</option>
                    <option value="600000">10m</option>
                    <option value="1800000">30m</option>
                    <option value="0">Off</option>
                </select>
                <!-- Live Seconds Countdown Display -->
                <span id="refresh-countdown" class="font-mono text-gray-400 text-xs ml-2 font-semibold"></span>
            </div>

            <!-- Manual Refresh Button -->
            <button 
                id="manual-refresh-btn"
                onclick="triggerDashboardRefresh()"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 hover:text-white rounded-md border border-gray-700 text-xs font-semibold tracking-wide transition-colors cursor-pointer"
                title="Refresh dashboard data now">
                <svg id="refresh-spinner" class="htmx-indicator animate-spin h-3.5 w-3.5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>↻ Refresh</span>
            </button>
        </div>
    </div>

    <!-- Live Container -->
    <div id="dashboard-live-container" class="space-y-8">
        {% include 'core/partials/dashboard_live_content.html' %}
    </div>
</div>

<script>
    let autoRefreshTimer = null;
    let countdownIntervalTimer = null;
    let scheduledTradeTimer = null;
    let nextRefreshTimestamp = null;

    function triggerDashboardRefresh() {
        const select = document.getElementById('auto-refresh-select');
        const intervalMs = select ? parseInt(select.value, 10) : 300000;
        if (intervalMs > 0) {
            nextRefreshTimestamp = Date.now() + intervalMs;
        }
        htmx.ajax('GET', "{% url 'dashboard' %}", {
            target: '#dashboard-live-container',
            swap: 'innerHTML',
            indicator: '#refresh-spinner'
        });
    }

    function formatCountdown(ms) {
        if (ms <= 0) return '0s';
        const totalSec = Math.floor(ms / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        if (mins > 0) {
            return `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
        }
        return `${secs}s`;
    }

    function updateCountdownDisplay() {
        const countdownEl = document.getElementById('refresh-countdown');
        if (!countdownEl) return;

        const select = document.getElementById('auto-refresh-select');
        const intervalMs = select ? parseInt(select.value, 10) : 0;

        if (intervalMs === 0) {
            countdownEl.textContent = '(Paused)';
            countdownEl.className = 'font-mono text-gray-500 text-xs ml-2';
            return;
        }

        if (!nextRefreshTimestamp) {
            nextRefreshTimestamp = Date.now() + intervalMs;
        }

        const remainingMs = Math.max(0, nextRefreshTimestamp - Date.now());
        countdownEl.textContent = `(${formatCountdown(remainingMs)})`;
        countdownEl.className = 'font-mono text-gray-400 text-xs ml-2';
    }

    function updateAutoRefreshSchedule() {
        const select = document.getElementById('auto-refresh-select');
        const pulseDot = document.getElementById('refresh-pulse-dot');
        if (!select) return;

        const intervalMs = parseInt(select.value, 10);
        localStorage.setItem('moondrip_dashboard_refresh_interval', intervalMs.toString());

        if (autoRefreshTimer) {
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = null;
        }

        if (intervalMs > 0) {
            if (pulseDot) pulseDot.classList.remove('hidden');
            nextRefreshTimestamp = Date.now() + intervalMs;
            autoRefreshTimer = setInterval(() => {
                triggerDashboardRefresh();
            }, intervalMs);
        } else {
            if (pulseDot) pulseDot.classList.add('hidden');
            nextRefreshTimestamp = null;
        }
        updateCountdownDisplay();
    }

    function planScheduledTradeRefresh() {
        if (scheduledTradeTimer) {
            clearTimeout(scheduledTradeTimer);
            scheduledTradeTimer = null;
        }

        const jobElements = document.querySelectorAll('[data-next-run]');
        let earliestTime = null;
        const now = Date.now();

        jobElements.forEach(el => {
            const isoTime = el.getAttribute('data-next-run');
            if (isoTime) {
                const timeMs = new Date(isoTime).getTime();
                if (timeMs > now) {
                    if (earliestTime === null || timeMs < earliestTime) {
                        earliestTime = timeMs;
                    }
                }
            }
        });

        if (earliestTime !== null) {
            // Buffer to allow the scheduler worker to place orders and receive exchange confirmations (approx 5-6s)
            const delayMs = Math.max(1000, (earliestTime - now) + 6000);
            if (delayMs < 86400000) { // Schedule if within 24 hours
                scheduledTradeTimer = setTimeout(() => {
                    triggerDashboardRefresh();
                    // Follow-up refresh 6s later to catch multi-token baskets with multiple exchange roundtrips
                    setTimeout(triggerDashboardRefresh, 6000);
                }, delayMs);
            }
        }
    }

    function updateLocalTimes() {
        const dateElements = document.querySelectorAll('.local-datetime');
        dateElements.forEach(el => {
            const utcTime = el.getAttribute('data-utc');
            if (utcTime && !el.dataset.processed) {
                const date = new Date(utcTime);
                el.textContent = date.toLocaleString(undefined, {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZoneName: 'short'
                });
                el.dataset.processed = "true";
            }
        });
    }

    function applyRecentActivitySettings() {
        const savedLimit = localStorage.getItem('moondrip_recent_cards_limit') || '3';
        const savedMode = localStorage.getItem('moondrip_recent_activity_mode') || 'jobs';

        const limitSelect = document.getElementById('recent-cards-limit-select');
        if (limitSelect) {
            limitSelect.value = savedLimit;
        }

        const titleEl = document.getElementById('recent-activity-title');
        if (titleEl) {
            titleEl.textContent = savedMode === 'jobs' ? 'Recent Jobs' : 'Recent Trades';
        }

        const limit = parseInt(savedLimit, 10);
        const tradesStack = document.getElementById('recent-trades-stack');
        const jobsStack = document.getElementById('recent-jobs-stack');
        const btnTrades = document.getElementById('mode-btn-trades');
        const btnJobs = document.getElementById('mode-btn-jobs');

        if (savedMode === 'jobs') {
            if (tradesStack) tradesStack.classList.add('hidden');
            if (jobsStack) jobsStack.classList.remove('hidden');
            if (btnTrades) {
                btnTrades.className = 'px-2.5 py-1 rounded text-xs font-bold transition-all text-gray-400 hover:text-white cursor-pointer';
            }
            if (btnJobs) {
                btnJobs.className = 'px-2.5 py-1 rounded text-xs font-bold transition-all bg-blue-600 text-white shadow-sm cursor-pointer';
            }
        } else {
            if (jobsStack) jobsStack.classList.add('hidden');
            if (tradesStack) tradesStack.classList.remove('hidden');
            if (btnJobs) {
                btnJobs.className = 'px-2.5 py-1 rounded text-xs font-bold transition-all text-gray-400 hover:text-white cursor-pointer';
            }
            if (btnTrades) {
                btnTrades.className = 'px-2.5 py-1 rounded text-xs font-bold transition-all bg-blue-600 text-white shadow-sm cursor-pointer';
            }
        }

        // Limit trade cards
        if (tradesStack) {
            const tradeCards = tradesStack.querySelectorAll('.trade-card');
            tradeCards.forEach(card => {
                const idx = parseInt(card.getAttribute('data-card-idx'), 10);
                if (idx < limit) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Limit job cards
        if (jobsStack) {
            const jobCards = jobsStack.querySelectorAll('.job-group-card');
            jobCards.forEach(card => {
                const idx = parseInt(card.getAttribute('data-card-idx'), 10);
                if (idx < limit) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }
    }

    window.setRecentActivityMode = function(mode) {
        localStorage.setItem('moondrip_recent_activity_mode', mode);
        applyRecentActivitySettings();
    };

    window.setRecentCardsLimit = function(limit) {
        localStorage.setItem('moondrip_recent_cards_limit', limit);
        applyRecentActivitySettings();
    };

    function initDashboard() {
        const select = document.getElementById('auto-refresh-select');
        if (select) {
            const saved = localStorage.getItem('moondrip_dashboard_refresh_interval');
            if (saved !== null && ['30000', '60000', '300000', '600000', '1800000', '0'].includes(saved)) {
                select.value = saved;
            } else {
                select.value = '300000'; // Default 5 minutes
            }
            select.addEventListener('change', updateAutoRefreshSchedule);
            updateAutoRefreshSchedule();
        }

        if (countdownIntervalTimer) {
            clearInterval(countdownIntervalTimer);
        }
        countdownIntervalTimer = setInterval(updateCountdownDisplay, 1000);
        updateCountdownDisplay();

        updateLocalTimes();
        applyRecentActivitySettings();
        planScheduledTradeRefresh();
    }

    window.handlePauseJobClick = function(btn) {
        btn.classList.add('pointer-events-none', 'opacity-75');
        const spinner = btn.querySelector('.pause-spinner');
        const text = btn.querySelector('.pause-text');
        if (spinner) spinner.classList.remove('hidden');
        if (text) text.textContent = 'Pausing...';
    };

    window.handleResumeJobConfirm = function(btn, jobPk) {
        const cancelBtn = document.getElementById('resume-cancel-btn-' + jobPk);
        if (cancelBtn) {
            cancelBtn.disabled = true;
            cancelBtn.classList.add('pointer-events-none', 'cursor-not-allowed', 'opacity-40');
        }
        btn.disabled = true;
        btn.classList.add('pointer-events-none', 'cursor-not-allowed', 'opacity-80');
        const spinner = btn.querySelector('.resume-spinner');
        const text = btn.querySelector('.resume-text');
        if (spinner) spinner.classList.remove('hidden');
        if (text) text.textContent = 'Resuming...';
    };

    document.addEventListener('DOMContentLoaded', initDashboard);
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        updateLocalTimes();
        applyRecentActivitySettings();
        planScheduledTradeRefresh();
    });
</script>
{% endblock %}
