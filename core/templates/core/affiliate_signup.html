{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto mb-12">
        <h1 class="text-4xl font-extrabold text-white sm:text-5xl sm:tracking-tight lg:text-6xl">
            Claim Your Free Pro Access
        </h1>
        <p class="mt-5 text-xl text-gray-400">
            Sign up to Toobit using our referral link and enter your UID below to get started.
        </p>
    </div>

    <div class="relative w-full max-w-md mx-auto">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-8">
                <form action="{% url 'affiliate_signup' %}" method="POST" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label for="exchange" class="block text-sm font-medium text-gray-400">Exchange</label>
                        <div class="mt-1">
                            <input type="text" value="Toobit" disabled
                                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md text-gray-300 cursor-not-allowed">
                        </div>
                    </div>

                    <div>
                        <label for="user_id" class="block text-sm font-medium text-gray-400">Toobit UID</label>
                        <div class="mt-1">
                            <input type="text" name="user_id" id="user_id" required
                                class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-md text-white focus:ring-blue-500 focus:border-blue-500"
                                placeholder="e.g. 12345678">
                        </div>
                        <p class="mt-2 text-sm text-gray-500">You can find your UID in your Toobit account settings.</p>
                    </div>

                    <button type="submit"
                        class="w-full flex items-center justify-center px-6 py-4 border border-transparent text-lg font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-lg">
                        Verify and Upgrade
                    </button>

                    <div class="mt-4 text-center">
                        <a href="https://www.toobit.com/" target="_blank"
                            class="text-sm text-blue-400 hover:text-blue-300 underline">Don't have a Toobit account?
                            Sign up here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
