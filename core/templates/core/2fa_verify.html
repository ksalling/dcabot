{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4 sm:px-6 lg:px-8 mt-10">
    <div class="bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-700">
        <div class="px-6 py-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-900/50 mb-4">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Two-Factor Authentication</h2>
                <p class="text-gray-400 text-sm">Enter the 6-digit code from your authenticator app to continue.</p>
            </div>

            <form action="{% url '2fa_verify' %}" method="POST">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label for="code" class="sr-only">Authentication Code</label>
                        <input type="text" name="code" id="code" required autofocus autocomplete="one-time-code"
                            class="block w-full text-center tracking-[0.5em] text-3xl px-4 py-4 bg-gray-900 border border-gray-600 rounded-lg text-white font-mono focus:ring-blue-500 focus:border-blue-500 transition-colors placeholder-gray-600"
                            placeholder="000000" maxlength="6" pattern="[0-9]{6}">
                    </div>

                    <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-900 transition-colors">
                        Verify Code
                    </button>

                    <div class="text-center mt-4 text-xs text-gray-500">
                        <a href="{% url 'login' %}" class="hover:text-white transition-colors">Cancel and return to
                            Login</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Auto-submit when 6 digits are entered
    document.getElementById('code').addEventListener('input', function (e) {
        if (this.value.length === 6 && /^\d+$/.test(this.value)) {
            this.form.submit();
        }
    });
</script>
{% endblock %}
