services:
  web:
    build: .
    command: [ "/bin/sh", "-c", "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:7060" ]
    volumes:
      - .:/app
    ports:
      - "7060:7060"
    env_file:
      - .env
    # Linux host networking to access local postgres
    # extra_hosts:
    #   - "host.docker.internal:host-gateway" 
    # Or use network_mode: host
    network_mode: host

# Note: Since the user specified a local Postgres instance on localhost:5432,
# we use network_mode: host to access it easily from the container on Linux.
